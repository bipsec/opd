# INT4 AWQ W4A16, group 128, via llm-compressor (rungs T4-int, D4). PLAN 4.2.
format: awq_w4a16_g128
scheme: W4A16
tool: llmcompressor
weight_bits: 4
group_size: 128
calibration:             # doc: same texts for every rung (built in PLAN 4.1)
  split: calibration
  n_samples: 512
  text_source: t16_traces  # BF16-teacher reasoning trace per prompt
  chat_format: true
  max_seq_len: 2048
optional: false
params: {}
