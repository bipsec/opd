[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qopd"
version = "0.0.1"
description = "Quantized-teacher on-policy distillation: how many bits does an OPD teacher need?"
readme = "CLAUDE.md"
requires-python = ">=3.11"
# Runtime deps live in requirements/*.txt (torch/vllm/flash-attn/triton come from the NGC container).
dependencies = []

[project.scripts]
qopd = "qopd.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks", "runs", "models", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN", "PL"]
ignore = [
  "ANN401",   # Any is fine at stub/probe boundaries
  "PLR0913",  # research functions take many knobs
  "PLR2004",  # magic numbers are config defaults in tests
  "RUF001",   # unicode in docstrings (×, −)
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR"]
"scripts/**" = ["PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "gpu: needs the GPU (run with `make test-gpu`)",
  "slow: takes longer than 60 s",
]
timeout = 600
